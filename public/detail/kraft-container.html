<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>크라프트 500 정사각 종이용기 상세페이지</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header {
      width: 100%; background: #fff; padding: 14px 24px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 10;
    }
    header a { color: #555; text-decoration: none; font-size: 14px; font-family: sans-serif; }
    header a:hover { color: #222; }
    header span { color: #bbb; font-size: 14px; }
    header h1 { font-size: 15px; font-weight: 600; color: #222; font-family: sans-serif; }
    .container {
      width: 100%; max-width: 1000px; background: #fff;
      margin: 24px 0 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .container img { width: 100%; display: block; }
  </style>
</head>
<body>
  <header>
    <a href="/my-portfolio/">← 포트폴리오로 돌아가기</a>
    <span>|</span>
    <h1>크라프트 종이용기 — 상세페이지</h1>
  </header>
  <div class="container">
    <img src="/my-portfolio/images/kraft-container.jpg" alt="크라프트 500 정사각 종이용기 상세페이지" />
  </div>
</body>
</html>
